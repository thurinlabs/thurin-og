name: CI

on:
  push:
  pull_request:

# thurin-og is a Bun service with no test suite; CI verifies the lockfile is
# valid and the entry point bundles cleanly (catches import/syntax breakage).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build smoke test
        run: bun build ./src/index.ts --target bun --outdir /tmp/thurin-og-build
